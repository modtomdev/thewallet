services:
  webapp_backend:
    image: devtom8/testrepo:webapp_backend1.0
    build:
      context: .
      dockerfile: thewallet/Dockerfile
      platforms:
        - linux/amd64
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - 80:5163
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - webapp-logs:/home/app/thewallet/logs
      - dataprotection-keys:/home/app/thewallet/keyring

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: test_database
    ports:
      - 5432:5432
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_logs:/var/log/postgresql
      - ./db/scripts:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - pgadmin_logs:/var/log/pgadmin

volumes:
  pg_data: {}
  pgadmin_data: {}