name: Build and Push Docker Server on Version Change

on:
  push:
    branches:
      - master
    paths:
      - 'version'

jobs:
  build-push-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set_version
        run: |
          version=$(cat ./version)
          echo "VERSION=$version" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ASP.NET Core Server Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: thewallet.web/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.set_version.outputs.VERSION }}
          push: true
          tags: devtom8/testrepo:server${{ steps.set_version.outputs.VERSION }}
